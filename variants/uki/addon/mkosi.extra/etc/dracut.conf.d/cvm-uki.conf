# Add the tools and drivers needed to contact KBS and unlock or create root
# before the normal operating system starts.
add_dracutmodules+=" dm crypt network network-manager systemd-repart "
force_drivers+=" tdx-guest dm-crypt dm-mod virtio_net "
install_items+=" /usr/libexec/repart-kbs-helper /usr/lib64/cryptsetup/libcryptsetup-token-kbs.so /usr/bin/trustee-attester /usr/lib/repart.d/60-root.conf "
