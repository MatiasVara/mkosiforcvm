# fetch encryption key from KBS before initrd systemd-repart creates the writable root
[Unit]
Wants=network-online.target
After=network-online.target initrd-usr-fs.target

[Service]
ExecStartPre=/bin/sh -ec 'umask 077; mkdir -p /run/cryptsetup-keys.d; rm -f /run/cryptsetup-keys.d/root.key.tmp; /usr/libexec/repart-kbs-helper > /run/cryptsetup-keys.d/root.key.tmp; mv /run/cryptsetup-keys.d/root.key.tmp /run/cryptsetup-keys.d/root.key'
ExecStart=
ExecStart=/usr/bin/systemd-repart --key-file=/run/cryptsetup-keys.d/root.key --dry-run=no
ExecStartPost=/usr/bin/rm -f /run/cryptsetup-keys.d/root.key
