# Temporary Fedora root used only to build the runtime addon initrd.

[Distribution]
Distribution=fedora
Release=rawhide

[Output]
Format=directory
Output=runtime-addon-root
OutputDirectory=../artifacts
CompressOutput=false

[Content]
# Early-boot tools needed before the encrypted root can be mounted.
Packages=
        trustee-guest-components
        libcryptsetup-token-kbs
        cryptsetup
        dracut
        dracut-network
        NetworkManager
        iproute
        gawk
        grep
        sed
        coreutils
        util-linux
        e2fsprogs
        systemd
        systemd-udev
        ca-certificates
        kernel-modules
        kernel-modules-core

SELinuxRelabel=no
