# mkosi configuration for the Fedora Rawhide prebuilt-UKI CVM variant
#
# Builds a self-encrypting CVM disk image using Fedora's distribution-signed
# kernel-uki-virt. build.sh builds and injects two locally signed companion
# addons next to that UKI.
#
# Usage:
#   ./build.sh uki
#
# Outputs (produced by variants/uki/build.sh):
#   fedora-rawhide-cvm-uki.raw        GPT disk image
#   fedora-rawhide-cvm-uki.efi        split Fedora UKI
#   fedora-rawhide-cvm-uki.roothash   /usr verity roothash
#   cvm-uki-image.qcow2               VM disk

[Distribution]
Distribution=fedora
Release=rawhide

[Build]
ToolsTree=yes
ToolsTreeDistribution=fedora
ToolsTreeRelease=rawhide

[Output]
Format=disk
ImageId=fedora-rawhide-cvm-uki
CompressOutput=false
# Consumed by build.sh for addon injection and the usrhash addon command line
SplitArtifacts=uki,roothash

[Content]
Packages=
        @core
        kernel
        kernel-uki-virt
        kernel-modules
        systemd
        systemd-udev
        systemd-boot-unsigned
        cryptsetup
        e2fsprogs
        util-linux
        tar
        NetworkManager
        shim-x64
        libcryptsetup-token-kbs
        trustee-guest-components

# These settings install Fedora's signed shim and prebuilt UKI instead of
# generating or locally signing a UKI. build.sh then adds the companion addons
# without modifying either Fedora-signed binary.
Bootable=yes
Bootloader=uki-signed
ShimBootloader=signed
UnifiedKernelImages=signed

SELinuxRelabel=yes

# Keep systemd-firstboot noninteractive in the VM.
Locale=C.UTF-8
Keymap=us
Timezone=UTC
RootPassword=redhat
