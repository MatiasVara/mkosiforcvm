# grub.cfg for Fedora with BLS (Boot Loader Specification)
# GRUB reads kernel entries from /boot/loader/entries/*.conf via blscfg.
#
# This config must tell GRUB to look at the XBOOTLDR partition (label "boot")
# since GRUB is loaded from the ESP but config/kernels are on the boot partition.

search --no-floppy --set=root --label boot
set prefix=($root)/grub2

set default=0
set timeout=3

function load_video {
    insmod all_video
}

load_video
insmod gzio
insmod part_gpt
insmod ext2
insmod xfs

load_env

insmod blscfg
blscfg
