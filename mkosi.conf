# mkosi configuration for Self-Encrypting CVM image
# Builds a Fedora Rawhide disk image with systemd-repart first-boot encryption.
# Uses Rawhide for latest systemd (EncryptAddToken=) and trustee-guest-components.
#
# Usage:
#   sudo mkosi build
#
# Output: cvm-selfencrypt.raw (GPT disk image)

[Distribution]
Distribution=fedora
Release=rawhide

[Output]
Format=disk
ImageId=fedora-rawhide-cvm
CompressOutput=false

[Content]
Packages=
        @core
        kernel
        systemd
        systemd-udev
        cryptsetup
        e2fsprogs
        util-linux
        tar
        dracut
        dracut-network
        NetworkManager
        grub2-efi-x64
        grub2-efi-x64-modules
        shim-x64
        efibootmgr
        grubby
        libcryptsetup-token-kbs
        trustee-guest-components

# Packages to include inside the initrd (for second+ boot LUKS unlock)
InitrdPackages=
        libcryptsetup-token-kbs
        trustee-guest-components
        systemd-udev
        cryptsetup
        NetworkManager

# Initrd profiles: 'network' enables networking in the initrd via systemd-networkd
InitrdProfiles=network

Bootloader=grub
SELinuxRelabel=yes
RootPassword=redhat

# First boot: root=LABEL=fedora finds the unencrypted linux-generic partition.
# post-repart.sh removes root= after encryption so gpt-auto-generator takes over.
KernelCommandLine=console=ttyS0,115200n8 rd.neednet=1 root=LABEL=fedora
KernelModulesInitrd=yes
KernelInitrdModules=tdx-guest dm-crypt dm-mod
