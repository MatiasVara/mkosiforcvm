# Initial root partition (unencrypted, for first boot only).
# Uses linux-generic type instead of root so that:
#   1. systemd-repart's first-boot Type=root definition doesn't match it
#   2. systemd-gpt-auto-generator ignores it after the encrypted root exists
# The kernel finds this partition via root=LABEL=fedora on the first boot.
[Partition]
Type=linux-generic
Format=ext4
Label=fedora
SizeMinBytes=2G
SizeMaxBytes=2G
CopyFiles=/
